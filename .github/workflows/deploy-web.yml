# apps/web to Vercel, after CI is green on main.
#
# `workflow_run` rather than `push` so a deploy can only follow a passing CI
# run -- with `push` the two race and a red build still ships.
name: Deploy web

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    # `workflow_run` fires on failure too; this is the gate.
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: production-web
      url: ${{ steps.deploy.outputs.url }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check whether deployment is configured
        id: guard
        env:
          TOKEN: ${{ secrets.VERCEL_TOKEN }}
        # Skip instead of fail when the credentials are absent. Deploy secrets
        # arrive after the workflow does, and a red main on every merge until
        # then trains people to ignore red -- which is worse than no deploy.
        run: |
          if [ -z "$TOKEN" ]; then
            echo "::notice::VERCEL_TOKEN is not set — skipping the deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        with:
          # workflow_run checks out the default branch head, not the commit that
          # triggered CI. Pin it, or a deploy can ship code CI never saw.
          ref: ${{ github.event.workflow_run.head_sha }}

      - uses: oven-sh/setup-bun@v2
        if: steps.guard.outputs.ready == 'true'
        with:
          bun-version: 1.4.1

      - name: Pull the project configuration
        if: steps.guard.outputs.ready == 'true'
        run: bunx vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.guard.outputs.ready == 'true'
        # Built here rather than on Vercel so the artifact comes from the same
        # commit CI verified, with this repo's bun install and turbo cache.
        run: bunx vercel@latest build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Deploy
        if: steps.guard.outputs.ready == 'true'
        id: deploy
        run: |
          url=$(bunx vercel@latest deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Deployed to $url" >> "$GITHUB_STEP_SUMMARY"
