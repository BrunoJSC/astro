[package]
name = "astro-desktop"
version = "0.0.0"
description = "Astro desktop client"
edition = "2021"
# Tauri v2's minimum. Pinned here so a too-old toolchain fails with a clear
# message instead of an error deep inside a dependency.
rust-version = "1.77.2"

[lib]
# The crate is a library with a thin binary in front of it, which is what lets
# the same `run()` be reused by a future mobile target -- `tauri android init`
# generates a wrapper that links this lib rather than calling main.rs.
name = "astro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Consumed by `tauri dev`; do not remove.
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# A Discord-style client ships a lot of webview; these keep the binary from
# carrying debug metadata and unreferenced code into the installer.
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
